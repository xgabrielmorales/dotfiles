# vim: ft=cfg

#-------------------------------------------
# Text / scripts
#-------------------------------------------
mime ^text,  label editor = ${VISUAL:-$EDITOR} -- "$@"
mime ^text,  label pager  = "$PAGER" -- "$@"
!mime ^text, label editor, ext xml|json|csv|tex|py|yml|yaml|js|sh|cpp|c|java|sql|rs|lua|nix = ${VISUAL:-$EDITOR} -- "$@"
!mime ^text, label pager,  ext xml|json|csv|tex|py|yml|yaml|js|sh|cpp|c|java|sql|rs|lua|nix = "$PAGER" -- "$@"

ext 1  = man "$1"
ext py = python -- "$1"
ext js = node   -- "$1"
ext sh = sh     -- "$1"

#-------------------------------------------
# Media
#-------------------------------------------
mime ^video|audio, has vlc, X, flag f = vlc -- "$@"

#-------------------------------------------
# Web / documents
#-------------------------------------------
ext x?html?, has zen-beta, X, flag f = zen-beta "$@"
ext pdf,     has zen-beta, X, flag f = zen-beta "$@"

#-------------------------------------------
# Images
#-------------------------------------------
mime ^image, has viewnior, X, flag f = viewnior -- "$@"
mime ^image, has zen-beta, X, flag f = zen-beta "$@"

#-------------------------------------------
# Archives
#-------------------------------------------
ext tar|gz|bz2|xz, has tar = tar vvtf "$1" | "$PAGER"
ext tar|gz|bz2|xz, has tar = for file in "$@"; do tar vvxf "$file"; done
ext zip, has unzip = unzip -l "$1" | "$PAGER"
ext zip, has unzip = for file in "$@"; do unzip -d "${file%.*}" "$file"; done
ext rar, has unrar = unrar l "$1" | "$PAGER"
ext rar, has unrar = for file in "$@"; do unrar x "$file"; done

#-------------------------------------------
# Generic fallbacks
#-------------------------------------------
label open, has xdg-open = xdg-open "$@"

!mime ^text, !ext xml|json|csv|tex|py|js|sh|nix = ask
label editor, !mime ^text, !ext xml|json|csv|tex|py|js|sh|nix = ${VISUAL:-$EDITOR} -- "$@"
label pager,  !mime ^text, !ext xml|json|csv|tex|py|js|sh|nix = "$PAGER" -- "$@"

mime application/x-executable = "$1"
label trash = mkdir -p -- ${XDG_DATA_DIR:-$HOME/.ranger}/ranger-trash; mv -- "$@" ${XDG_DATA_DIR:-$HOME/.ranger}/ranger-trash
