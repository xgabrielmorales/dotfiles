auto_sync = true
inline_height = 20
keymap_mode = "emacs"
prefers_reduced_motion = true
search_mode = "fuzzy"
show_help = false
show_numeric_shortcuts = false
show_preview = false
show_tabs = false
style = "compact"
sync_address = "https://atuin.xgabrielmorales.com"
sync_frequency = "5m"
history_filter = [
  "^ls($| )",
  "^cd($| )",
  "^curl($| )",
  "^cp($| )",
  "^pwd$",
  "^exit$",
  "^history$"
]

[ui]
columns = ["time", "command"]

[daemon]
enabled = true
autostart = true

[threads]
capture = true

[theme]
name = "onedark"
